<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별똥 택배</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 전체 화면 캔버스 위에 운송장(waybill) 모양의 얇은 UI를 얹는다. 굵은 것은 제목 하나뿐. */
  --void:#070818; --panel:#0e0f26; --ink:#eceeff; --dim:#8f94bd; --line:#34386a;
  --amber:#ffc65c; --mint:#6ff2c4; --danger:#ff7d6b;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:14px 16px;pointer-events:none}
.waybill{display:flex;align-items:stretch;background:rgba(14,15,38,.82);border:1px dashed var(--line);pointer-events:auto}
.waybill>div{padding:6px 12px;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:1px;justify-content:center}
.waybill>div:last-child{border-right:0}
.waybill small{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.waybill b{font-weight:700;font-size:14px;white-space:nowrap}
#wb-no,#wb-try{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
#wb-stars{color:var(--amber);letter-spacing:.1em}
.tools{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.tools button{background:rgba(14,15,38,.82);border:1px solid var(--line);padding:7px 12px;font-size:13px;border-radius:2px}
.tools button:hover{border-color:var(--amber);color:var(--amber)}
.tools button[aria-pressed="true"]{border-color:var(--mint);color:var(--mint)}
.tools kbd{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:5px}
#readout{position:fixed;left:16px;bottom:14px;font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
#fuel{position:fixed;right:16px;bottom:14px;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:var(--dim);pointer-events:none}
#fuel span{display:block;width:120px;height:6px;border:1px solid var(--line);background:rgba(14,15,38,.8)}
#fuelbar{display:block;height:100%;background:#7fdcff;transform-origin:left}
#tip{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(62ch,calc(100% - 32px));background:rgba(14,15,38,.9);border-left:3px solid var(--amber);padding:10px 14px;font-size:14px;line-height:1.6;pointer-events:none;text-wrap:pretty}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--amber);background:rgba(7,8,24,.9);border:1px dashed var(--amber);padding:12px 20px}

/* 제목 */
#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,6vh,64px) clamp(16px,5vw,72px);background:linear-gradient(100deg,rgba(7,8,24,.94) 0%,rgba(7,8,24,.72) 34%,rgba(7,8,24,0) 68%);pointer-events:none}
#title>*{pointer-events:auto}
.stamp{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--amber);border:1px dashed var(--amber);padding:5px 10px;width:max-content;max-width:100%;transform:rotate(-2deg);margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,13vw,168px);line-height:.92;margin:0;color:var(--amber);letter-spacing:-.01em;text-shadow:0 0 60px rgba(255,170,60,.35)}
h1 span{display:block;color:var(--ink)}
.lede{max-width:40ch;font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:#c9cdf0;margin:20px 0 26px;text-wrap:pretty}
.menu{display:flex;flex-wrap:wrap;gap:10px}
.menu button,.panel-actions button{border:1px solid var(--line);background:rgba(14,15,38,.85);padding:12px 22px;font-size:16px;font-weight:500;border-radius:2px}
.menu button:hover,.panel-actions button:hover{border-color:var(--amber);color:var(--amber)}
button.primary{background:var(--amber);color:#1b1304;border-color:var(--amber);font-weight:700}
button.primary:hover{background:#ffd98c;color:#1b1304}
.keys{margin-top:22px;font-size:12px;color:var(--dim);line-height:1.8}
.keys kbd{font-family:var(--mono);border:1px solid var(--line);padding:1px 6px;margin-right:3px;color:var(--ink)}

/* 구역 목록 */
#levels{position:fixed;inset:0;background:rgba(7,8,24,.93);overflow:auto;padding:clamp(20px,5vh,56px) clamp(16px,5vw,72px)}
#levels header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,52px);margin:0;color:var(--ink)}
#lv-total{font-family:var(--mono);color:var(--amber);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:22px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--panel);border:1px dashed var(--line);padding:14px;min-height:108px;border-radius:2px}
.tile:hover:not(:disabled){border-color:var(--amber);border-style:solid}
.tile:disabled{opacity:.38;cursor:not-allowed}
.tile .tn{font-family:var(--mono);font-size:12px;color:var(--dim)}
.tile .tt{font-size:17px;font-weight:700}
.tile .ts{margin-top:auto;font-size:14px;color:var(--dim);letter-spacing:.08em}
.tile.done .ts{color:var(--amber)}

/* 완료 영수증 */
#win{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(7,8,24,.55)}
.receipt{position:relative;width:min(440px,100%);background:var(--panel);border:1px dashed var(--line);padding:28px 26px 24px}
.receipt .done-stamp{position:absolute;right:18px;top:16px;font-family:var(--display);font-size:22px;color:var(--mint);border:2px solid var(--mint);padding:4px 12px;transform:rotate(7deg);letter-spacing:.06em}
#win-no{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;padding-right:120px}
#win-stars{font-size:54px;color:var(--amber);letter-spacing:.08em;margin:18px 0 6px;line-height:1}
#win-note{font-size:14px;line-height:1.6;color:#c9cdf0;margin:0 0 18px;text-wrap:pretty}
.receipt dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0 0 22px;padding:14px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:14px}
.receipt dt{color:var(--dim)} .receipt dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.panel-actions{display:flex;flex-wrap:wrap;gap:8px}
.panel-actions button{padding:10px 16px;font-size:15px}
@media (max-width:560px){.tools kbd{display:none}.waybill>div{padding:5px 8px}#tip{bottom:40px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="게임 화면"></canvas>

<div id="hud" class="hidden">
  <div class="waybill">
    <div><small>운송장</small><b id="wb-no"></b></div>
    <div><small>구역</small><b id="wb-name"></b></div>
    <div><small>별</small><b id="wb-stars"></b></div>
    <div><small>발사</small><b id="wb-try"></b></div>
  </div>
  <div class="tools">
    <button id="b-retry" type="button">다시 조준<kbd>R</kbd></button>
    <button id="b-hint" type="button" aria-pressed="false">정답 방향 보기<kbd>H</kbd></button>
    <button id="b-sound" type="button">소리 끄기</button>
    <button id="b-list" type="button">구역 목록</button>
  </div>
</div>
<div id="readout" class="hidden"></div>
<div id="fuel" class="hidden">추진 연료 <span><i id="fuelbar"></i></span></div>
<div id="tip" class="hidden"></div>
<div id="busy" class="hidden">항로 계산 중</div>

<section id="title">
  <div class="stamp">취급주의 · 블랙홀 근처 배송</div>
  <h1>별똥<span>택배</span></h1>
  <p class="lede">엔진은 1.2초치뿐입니다. 행성의 중력을 빌려 소포를 휘돌려 보내세요. 16개 구역은 전부 자동 풀이기가 검증한 항로가 있고, 그 뒤로는 무한히 새 구역이 만들어집니다.</p>
  <div class="menu">
    <button id="t-start" class="primary" type="button">배달 시작</button>
    <button id="t-levels" type="button">구역 목록</button>
    <button id="t-endless" type="button">무한 배달</button>
  </div>
  <div class="keys"><kbd>마우스</kbd>조준 <kbd>클릭</kbd>발사 <kbd>Space</kbd>추진 <kbd>←→↑↓</kbd>미세 조정 (Shift로 더 세밀하게)</div>
</section>

<section id="levels" class="hidden">
  <header><h2>배달 구역</h2><span id="lv-total"></span></header>
  <div id="grid"></div>
  <div class="panel-actions">
    <button id="lv-back" type="button">처음 화면</button>
    <button id="lv-endless" type="button">무한 배달</button>
  </div>
</section>

<section id="win" class="hidden">
  <div class="receipt">
    <div class="done-stamp">배달 완료</div>
    <div id="win-no"></div>
    <div id="win-stars"></div>
    <p id="win-note"></p>
    <dl><dt>비행 시간</dt><dd id="win-time"></dd><dt>발사 횟수</dt><dd id="win-try"></dd></dl>
    <div class="panel-actions">
      <button id="w-next" class="primary" type="button">다음 구역</button>
      <button id="w-retry" type="button">다시 배달</button>
      <button id="w-list" type="button">구역 목록</button>
    </div>
  </div>
</section>

<script>
// ===================== CORE: 물리 · 생성 · 풀이 =====================
const W = 1600, H = 900, DT = 1 / 100, MAXT = 16, MAXSTEPS = Math.round(MAXT / DT);
const VMIN = 170, VMAX = 520, TR = 30, THR = 170, FUEL = 1.2, STAR_R = 26;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 캠페인 16구역 설정
const CAMPAIGN = [
  { name: '첫 배달',        planets: 1, minTurn: 0.5, preview: 300 },
  { name: '돌아가는 길',    planets: 2, minTurn: 0.7, preview: 280 },
  { name: '달그림자',       planets: 2, moons: 1, minTurn: 0.8, preview: 260 },
  { name: '세 개의 우물',   planets: 3, minTurn: 0.9, preview: 250 },
  { name: '공전 시간표',    planets: 3, moons: 1, minTurn: 1.0, preview: 240 },
  { name: '검은 입',        planets: 2, bh: 1, minTurn: 1.0, preview: 240 },
  { name: '밀어내는 별',    planets: 3, rep: 1, minTurn: 1.0, preview: 230 },
  { name: '지름길',         planets: 2, worm: 1, minTurn: 0.9, preview: 230 },
  { name: '사건의 지평선',  planets: 3, moons: 1, bh: 1, minTurn: 1.1, preview: 220 },
  { name: '역풍',           planets: 3, moons: 1, rep: 1, minTurn: 1.2, preview: 210 },
  { name: '환승역',         planets: 4, worm: 1, minTurn: 1.2, preview: 200 },
  { name: '당기고 밀고',    planets: 3, bh: 1, rep: 1, minTurn: 1.3, preview: 190 },
  { name: '쌍둥이 달',      planets: 4, moons: 2, minTurn: 1.4, preview: 180 },
  { name: '위험한 지름길',  planets: 3, bh: 1, worm: 1, minTurn: 1.4, preview: 170 },
  { name: '혼잡 구간',      planets: 4, moons: 1, rep: 1, worm: 1, minTurn: 1.5, preview: 160 },
  { name: '마지막 소포',    planets: 4, moons: 2, bh: 1, rep: 1, worm: 1, minTurn: 1.6, preview: 150 },
];
// node 검증으로 미리 구한 "첫 성공 시도 번호" (브라우저에서 생성 시간을 줄이기 위함)
const CAMPAIGN_ATT = [0,0,0,11,16,6,1,2,8,1,11,7,16,1,3,13];
function campaignSeed(i) { return 7001 + i * 131; }

function endlessCfg(seed) {
  const r = mulberry32(seed ^ 0x5bd1e995);
  const cfg = { name: '무한 배달', planets: 2 + (r() * 3 | 0), minTurn: 1.0 + r() * 0.6, preview: 170 + (r() * 60 | 0) };
  if (r() < 0.55) cfg.moons = 1 + (r() < 0.3 ? 1 : 0);
  if (r() < 0.45) cfg.bh = 1;
  if (r() < 0.45) cfg.rep = 1;
  if (r() < 0.45) cfg.worm = 1;
  return cfg;
}

// 레벨 골격 만들기 (풀이 가능 여부는 아직 모름)
function build(rng, cfg) {
  const L = { st: [], moons: [], worm: null, cfg };
  L.start = { x: 130 + rng() * 100, y: 220 + rng() * 460 };
  L.target = { x: 1370 + rng() * 100, y: 220 + rng() * 460 };
  const occ = []; // 자리 차지 목록 {x,y,sr}
  const fits = (x, y, sr) => {
    if (x < sr + 20 || x > W - sr - 20 || y < sr + 20 || y > H - sr - 20) return false;
    if (Math.hypot(x - L.start.x, y - L.start.y) < sr + 150) return false;
    if (Math.hypot(x - L.target.x, y - L.target.y) < sr + 110) return false;
    for (const o of occ) if (Math.hypot(x - o.x, y - o.y) < sr + o.sr + 80) return false;
    return true;
  };
  let moonsLeft = cfg.moons || 0;
  const addPlanet = (x, y, R) => {
    const p = { type: 'planet', x, y, r: R, mu: 2200 * R * R, c2: R * R, s: 0 };
    let sr = R;
    if (moonsLeft > 0 && R >= 40) {
      const orb = R + 50 + rng() * 28, mr = 9 + rng() * 4;
      const w = (0.5 + rng() * 0.45) * (rng() < 0.5 ? -1 : 1);
      p.moon = { orb, r: mr, w, ph: rng() * Math.PI * 2, mu: 3000 * mr * mr, c2: mr * mr };
      sr = orb + mr; moonsLeft--;
    }
    p.sr = sr;
    return p;
  };
  // 1) 직선 경로를 막는 행성
  {
    let ok = false;
    for (let k = 0; k < 40 && !ok; k++) {
      const t = 0.42 + rng() * 0.16, R = 48 + rng() * 20;
      const dx = L.target.x - L.start.x, dy = L.target.y - L.start.y, d = Math.hypot(dx, dy);
      const off = (rng() * 2 - 1) * R * 0.3;
      const x = L.start.x + dx * t - dy / d * off, y = L.start.y + dy * t + dx / d * off;
      const p = addPlanet(x, y, R);
      if (fits(x, y, p.sr)) { L.st.push(p); occ.push({ x, y, sr: p.sr }); ok = true; }
      else if (p.moon) moonsLeft++;
    }
    if (!ok) return null;
  }
  const place = (n, make) => {
    for (let i = 0; i < n; i++) {
      let ok = false;
      for (let k = 0; k < 120 && !ok; k++) {
        const x = 330 + rng() * 940, y = 110 + rng() * 680;
        const b = make(x, y);
        if (fits(x, y, b.sr)) { L.st.push(b); occ.push({ x, y, sr: b.sr }); ok = true; }
        else if (b.moon) moonsLeft++;
      }
      if (!ok) return false;
    }
    return true;
  };
  if (!place(cfg.planets - 1, (x, y) => addPlanet(x, y, 30 + rng() * 32))) return null;
  if (cfg.bh && !place(cfg.bh, (x, y) => ({ type: 'bh', x, y, r: 15, mu: 8e6, c2: 225, s: 0, sr: 70 }))) return null;
  if (cfg.rep && !place(cfg.rep, (x, y) => ({ type: 'rep', x, y, r: 12, mu: -4.5e6, c2: -1, s: 1600, sr: 60 }))) return null;
  if (cfg.worm) {
    let ok = false;
    for (let k = 0; k < 200 && !ok; k++) {
      const ax = 300 + rng() * 1000, ay = 90 + rng() * 720, bx = 300 + rng() * 1000, by = 90 + rng() * 720;
      if (Math.hypot(ax - bx, ay - by) < 480) continue;
      if (!fits(ax, ay, 45) || !fits(bx, by, 45)) continue;
      L.worm = { ax, ay, bx, by, r: 20 };
      occ.push({ x: ax, y: ay, sr: 45 }, { x: bx, y: by, sr: 45 });
      ok = true;
    }
    if (!ok) return null;
  }
  if (moonsLeft > 0) return null;
  // 좌우 반전으로 다양성
  if (rng() < 0.5) {
    const fx = o => { o.x = W - o.x; };
    fx(L.start); fx(L.target); L.st.forEach(b => { fx(b); if (b.moon) { b.moon.w = -b.moon.w; b.moon.ph = Math.PI - b.moon.ph; } });
    if (L.worm) { L.worm.ax = W - L.worm.ax; L.worm.bx = W - L.worm.bx; }
  }
  for (const b of L.st) if (b.moon) L.moons.push({ px: b.x, py: b.y, ...b.moon });
  return L;
}

function moonPos(m, k, out) {
  const a = m.ph + m.w * k * DT;
  out.x = m.px + Math.cos(a) * m.orb; out.y = m.py + Math.sin(a) * m.orb;
  return out;
}

function newFlight(L, ang, pw) {
  const v = VMIN + (VMAX - VMIN) * pw;
  return { x: L.start.x, y: L.start.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, k: 0, inW: false, turn: 0, warped: false, hitBody: -1 };
}

// 한 스텝 전진. 0=계속 1=도착 2=충돌 3=이탈
function step(L, f, thr) {
  const x = f.x, y = f.y;
  let ax = 0, ay = 0;
  const B = L.st;
  for (let i = 0; i < B.length; i++) {
    const b = B[i], dx = b.x - x, dy = b.y - y, d2 = dx * dx + dy * dy;
    if (d2 < b.c2) { f.hitBody = i; return 2; }
    const q = d2 + b.s, inv = b.mu / (q * Math.sqrt(q));
    ax += dx * inv; ay += dy * inv;
  }
  const M = L.moons;
  if (M.length) {
    const tm = f.k * DT;
    for (let i = 0; i < M.length; i++) {
      const m = M[i], a = m.ph + m.w * tm;
      const dx = m.px + Math.cos(a) * m.orb - x, dy = m.py + Math.sin(a) * m.orb - y, d2 = dx * dx + dy * dy;
      if (d2 < m.c2) { f.hitBody = 100 + i; return 2; }
      const inv = m.mu / (d2 * Math.sqrt(d2));
      ax += dx * inv; ay += dy * inv;
    }
  }
  const vx = f.vx, vy = f.vy, v2 = vx * vx + vy * vy;
  if (thr) { const sp = Math.sqrt(v2) || 1; ax += vx / sp * THR; ay += vy / sp * THR; }
  const nvx = vx + ax * DT, nvy = vy + ay * DT;
  f.turn += Math.abs(vx * nvy - vy * nvx) / (v2 || 1);
  f.vx = nvx; f.vy = nvy;
  f.x = x + nvx * DT; f.y = y + nvy * DT; f.k++;
  const wm = L.worm;
  if (wm) {
    const r2 = wm.r * wm.r;
    const da = (f.x - wm.ax) ** 2 + (f.y - wm.ay) ** 2, db = (f.x - wm.bx) ** 2 + (f.y - wm.by) ** 2;
    if (f.inW) { if (da > r2 && db > r2) f.inW = false; }
    else if (da < r2) { f.x += wm.bx - wm.ax; f.y += wm.by - wm.ay; f.inW = true; f.warped = true; }
    else if (db < r2) { f.x += wm.ax - wm.bx; f.y += wm.ay - wm.by; f.inW = true; f.warped = true; }
  }

// 전수 탐색 풀이기: 720각도 × 12세기. 주변 값에서도 성공하는 "튼튼한" 해만 채택

}

const cache = new Map();
function getLevel(seed, cfg, att0, cb) {

  let a = att0;
  (function loop() {
    const t = performance.now(); let Lv = null;
    while (!Lv && performance.now() - t < 24 && a < att0 + 600) Lv = tryAttempt(seed, cfg, a++);
    if (Lv) { cache.set(key, Lv); $('busy').classList.add('hidden'); cb(Lv); }
    else if (a >= att0 + 600) { $('busy').classList.add('hidden'); if (mode === 'endless') startEndless(); }

}

  $('win-time').textContent = (fl.k * DT).toFixed(2) + '초';
  $('win-try').textContent = attempts + '회';
  $('win-note').textContent = n === 3 ? '별 세 개를 모두 지났습니다.' : `별 ${3 - n}개를 놓쳤습니다. 별은 세 개를 모두 지나는 궤도 위에 놓여 있습니다.`;
  const lastOne = mode === 'campaign' && idx === CAMPAIGN.length - 1;
  $('w-next').textContent = lastOne ? '무한 배달 시작' : mode === 'campaign' ? '다음 구역' : '다음 배달';
  show('win'); $('w-next').focus();
}
function showLevels() {
  const g = $('grid'); g.innerHTML = '';
  CAMPAIGN.forEach((c, i) => {
    const locked = i > 0 && !prog[i - 1] && !prog[i], b = document.createElement('button');
    b.className = 'tile' + (prog[i] ? ' done' : ''); b.disabled = locked;
    b.innerHTML = `<span class="tn">${String(i + 1).padStart(2, '0')}</span><span class="tt">${c.name}</span><span class="ts">${locked ? '잠김' : prog[i] ? starStr(prog[i] - 1) : '미배달'}</span>`;
    b.onclick = () => { AU.init(); AU.click(); startCampaign(i); };
    g.appendChild(b);
  });
  const total = prog.reduce((s, v) => s + Math.max(0, v - 1), 0);
  $('lv-total').textContent = `모은 별 ${total} / ${CAMPAIGN.length * 3}`;
  hide('title'); hide('win'); show('levels');
}
function toTitle() {
  hide('levels'); hide('win'); hide('tip'); show('title'); mode = 'campaign';
  getLevel(campaignSeed(2), CAMPAIGN[2], CAMPAIGN_ATT[2] || 0, Lv => startLevel(Lv, true));
}

// ---------- 입력 ----------
function toWorld(e) { const r = cv.getBoundingClientRect(); mp.x = (e.clientX - r.left - ox) / sc; mp.y = (e.clientY - r.top - oy) / sc; }
function aimFromPointer() {
  const dx = mp.x - L.start.x, dy = mp.y - L.start.y, d = Math.hypot(dx, dy); if (d < 10) return;
  aim.ang = Math.atan2(dy, dx); aim.pw = clamp((d - 50) / 330, 0, 1); pvDirty = true;
}
cv.addEventListener('pointerdown', e => {
  AU.init(); if (demo || !L) return; down = true; toWorld(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === 'aim') { armed = true; aimFromPointer(); } else if (state === 'fly') thrusting = true;
});
cv.addEventListener('pointermove', e => { if (demo || !L || state !== 'aim') return; if (e.pointerType === 'mouse' || down) { toWorld(e); aimFromPointer(); } });
const pUp = () => { if (state === 'aim' && down && armed && !demo) launch(aim.ang, aim.pw); down = false; armed = false; thrusting = false; };
cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', () => { down = false; armed = false; thrusting = false; });
function retry() { if (demo || !L || state === 'boot') return; hide('win'); if (fl && state === 'fly') ghost = trail.slice(); state = 'aim'; endTimer = 0; resetShot(); updateHud(); }
addEventListener('keydown', e => {
  if (demo || !L || !$('levels').classList.contains('hidden')) return;
  const fine = e.shiftKey ? 0.0005 : 0.004;
  if (e.code === 'Space') { e.preventDefault(); AU.init(); if (state === 'fly') thrusting = true; else if (state === 'aim' && !e.repeat) launch(aim.ang, aim.pw); }
  else if (e.code === 'Enter' && state === 'aim' && document.activeElement === document.body) launch(aim.ang, aim.pw);
  else if (state === 'aim' && e.code === 'ArrowLeft') { aim.ang -= fine; pvDirty = true; e.preventDefault(); }
  else if (state === 'aim' && e.code === 'ArrowRight') { aim.ang += fine; pvDirty = true; e.preventDefault(); }
  else if (state === 'aim' && e.code === 'ArrowUp') { aim.pw = clamp(aim.pw + (e.shiftKey ? 0.001 : 0.006), 0, 1); pvDirty = true; e.preventDefault(); }
  else if (state === 'aim' && e.code === 'ArrowDown') { aim.pw = clamp(aim.pw - (e.shiftKey ? 0.001 : 0.006), 0, 1); pvDirty = true; e.preventDefault(); }
  else if (e.code === 'KeyR') retry();
  else if (e.code === 'KeyH') toggleHint();
});
addEventListener('keyup', e => { if (e.code === 'Space') thrusting = false; });
function toggleHint() { if (demo) return; hintOn = !hintOn; updateHud(); }
const on = (id, fn) => $(id).addEventListener('click', () => { AU.init(); AU.click(); fn(); $(id).blur(); });
on('b-retry', retry); on('b-hint', toggleHint); on('b-list', showLevels);
on('b-sound', () => { AU.setMuted(!AU.muted); $('b-sound').textContent = AU.muted ? '소리 켜기' : '소리 끄기'; });
on('t-start', () => { let i = prog.findIndex(v => !v); if (i < 0) i = 0; startCampaign(i); });
on('t-levels', showLevels); on('t-endless', () => startEndless());
on('lv-back', toTitle); on('lv-endless', () => startEndless());
on('w-retry', retry); on('w-list', showLevels);
on('w-next', () => { if (mode === 'campaign' && idx < CAMPAIGN.length - 1) startCampaign(idx + 1); else startEndless(); });

// ---------- 시작 ----------
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; update(dt); draw(); requestAnimationFrame(frame); }
function boot(data) {
  resize(); addEventListener('resize', resize);
  if (data && data.playing) { data.mode === 'endless' ? startEndless(data.eseed) : startCampaign(data.idx | 0); } else toTitle();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ playing: !demo && state !== 'boot', mode, idx, eseed }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

</script>
