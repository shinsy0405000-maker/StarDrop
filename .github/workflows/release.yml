# 배포: GitHub 에서 Release 를 발행하면 자동으로
#   1) StarDrop.jar           (자바 21 이상이 깔린 컴퓨터에서 더블클릭)
#   2) StarDrop-windows.zip   (자바 없이 실행되는 윈도우 프로그램, 압축 풀고 StarDrop.exe)
# 를 만들어 Release 에 붙인다. Actions 탭에서 손으로 돌릴 수도 있다.
name: 배포

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 컴파일하고 jar 만들기
        shell: bash
        run: |
          mkdir -p build/classes build/jar
          javac -encoding UTF-8 --release 21 -d build/classes src/*.java
          cp -r src/fonts build/classes/fonts
          jar --create --file build/jar/StarDrop.jar --main-class StarDrop -C build/classes .

      - name: 윈도우 실행 파일 만들기 (자바 포함)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || VERSION=1.0.0
          jpackage --type app-image --name StarDrop --input build/jar --main-jar StarDrop.jar --main-class StarDrop \
            --app-version "$VERSION" --vendor StarDrop --description "StarDrop - gravity delivery puzzle" \
            --add-modules java.desktop,java.prefs --dest build/app
          cd build/app && 7z a ../StarDrop-windows.zip StarDrop

      - name: Release 에 파일 붙이기
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/jar/StarDrop.jar build/StarDrop-windows.zip --clobber

      - name: 손으로 돌렸을 때는 Actions 결과물로 저장
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StarDrop
          path: |
            build/jar/StarDrop.jar
            build/StarDrop-windows.zip
