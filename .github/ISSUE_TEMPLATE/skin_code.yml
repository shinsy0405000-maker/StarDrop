name: 스킨 코드 요청
description: 유료 스킨(은하수 소포, 황금 택배)을 열 코드를 받아요
title: "[스킨 코드] "
body:
  - type: markdown
    attributes:
      value: |
        후원해 주셔서 고맙습니다!
        1. 게임의 **스킨** 창에서 유료 스킨을 누르고, QR로 카카오페이 송금을 해 주세요.
        2. **송금 메시지에 기기 번호**를 적어 주세요 (스킨 창에 나와 있어요).
        3. 이 요청을 올리면, 개발자가 송금을 확인한 뒤 **이 이슈에 댓글로 코드**를 달아 드려요.

        코드는 적어 주신 기기 번호의 컴퓨터에서만 열려서, 댓글로 공개돼도 괜찮아요.
        이름이나 연락처 같은 개인정보는 적지 마세요.
  - type: input
    id: skin
    attributes:
      label: 스킨
      placeholder: 예) 황금 택배 (gold)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기 번호
      description: 게임의 스킨 창에 나오는 번호 (예 ABCDE-FGHJK). 게임에서 "GitHub에서 코드 요청"을 누르면 자동으로 채워져요.
      placeholder: ABCDE-FGHJK
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 하고 싶은 말 (선택)
